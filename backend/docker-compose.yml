services:
  db:
    image: postgres:16
    # Credentials come from .env, which compose reads for interpolation — the
    # same file DATABASE_URL lives in, so the two can't drift apart, and no
    # password is committed. The :? form fails the run with this message rather
    # than silently initialising the volume under a different role.
    environment:
      POSTGRES_USER: ${PGUSER:?set PGUSER in backend/.env to the user in DATABASE_URL}
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD in backend/.env to the password in DATABASE_URL}
      POSTGRES_DB: ${PGDATABASE:-true_gym}
    # NOTE: those three are read only when the volume is first initialised.
    # Changing them later does nothing to a volume that already has a cluster
    # in it — that takes an ALTER ROLE, or deleting the volume.
    volumes:
      - true_gym_data:/var/lib/postgresql/data
    # The API does not come through here — it reaches this container by service
    # name on the compose network. This publish exists only so psql and a venv
    # `uvicorn` can reach the same database from the host.
    #
    # 5433, not 5432, and bound to loopback. A published port is claimed on the
    # host, so publishing 5432 would fight whatever the system's own postgres
    # is doing with it; off that port the two coexist and neither has to be
    # stopped. Loopback because nothing outside this machine needs the database.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      # -h forces TCP. Without it pg_isready asks the Unix socket, which the
      # temporary server used while initialising a fresh volume already answers
      # — so the check passes, the API is let through, and it is refused on
      # 5432 because nothing is listening there yet. TCP is what the API
      # actually uses, so TCP is what health has to mean.
      test:
        ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${PGUSER} -d ${PGDATABASE:-true_gym}"]
      interval: 5s
      timeout: 5s
      retries: 5
      # First run has to create the cluster before any of that can succeed.
      start_period: 30s
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      # Overrides the DATABASE_URL in .env, which names the host so a venv run
      # can reach the published port above. In here `db` is the service next
      # door on the compose network, and the host's ports are not involved at
      # all — which is the point: nothing the API does can collide with the
      # system's postgres.
      DATABASE_URL: postgresql+asyncpg://${PGUSER}:${PGPASSWORD}@db:5432/${PGDATABASE:-true_gym}
    # Published on every interface, because a phone running Expo Go reaches
    # this over the network. Note that Docker forwards published ports before
    # ufw's input rules see them, so a firewall rule for 8000 is not what is
    # keeping this closed — the LAN can reach it regardless.
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # curl isn't in the slim image, and Python is right there.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/health")
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  true_gym_data:
    # Named explicitly, so it is true_gym_data and not backend_true_gym_data:
    # compose prefixes the project (the directory) otherwise, and renaming or
    # moving the folder would leave the database behind in an orphaned volume.
    name: true_gym_data
